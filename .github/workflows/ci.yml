name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # keystore.properties is absent here by design; the signing config in
      # app/build.gradle.kts guards on its existence, so debug builds work.
      - name: Check formatting, static analysis and build
        run: ./gradlew spotlessCheck detekt assembleDebug
